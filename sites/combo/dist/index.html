<!doctype html>
<html lang="bg">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101c22"><meta name="description" content="Комбо — осем рунда знания, тайни оферти и комбинации.">
<title>Комбо</title><link rel="stylesheet" href="style.css">
</head>
<body data-phase="lobby">
<canvas id="space" aria-hidden="true"></canvas><div class="ambient" aria-hidden="true"></div>
<div class="shell">
<header><a class="brand" href="./" aria-label="Комбо — начало"><span class="mark">✳</span> КОМБО</a><div class="header-right"><button id="restart" class="icon-button" aria-label="Нов дуел" title="Нов дуел">↻</button><button id="rules" class="icon-button" aria-label="Как се играе" title="Как се играе">?</button><button id="fullscreen" class="icon-button" aria-label="На цял екран" title="На цял екран"></button></div></header>
<main><div id="scores" class="scores"></div><section id="stage" class="stage" aria-label="Игрови екран" aria-live="polite"></section></main>
</div>
<p id="fullscreen-note" class="toast" role="status" hidden></p>
<dialog id="help" aria-labelledby="help-title"><button id="close-help" class="icon-button close" aria-label="Затвори правилата">✕</button><h2 id="help-title">Как се играе</h2><div id="help-content"></div><button id="help-ok" class="primary">Ясно</button></dialog>
<script type="module" src="app.js"></script>
</body></html>
